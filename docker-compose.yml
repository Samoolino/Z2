name: z2

services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      Z2_MODE: observe_only
      Z2_LIVE_TRADING_ENABLED: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-z2}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-z2}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-z2}
      POSTGRES_USER: ${POSTGRES_USER:-z2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - z2_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-z2} -d ${POSTGRES_DB:-z2}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.0-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - z2_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    profiles: ["nats"]
    command: ["-js", "-sd", "/data"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - z2_nats_data:/data

volumes:
  z2_postgres_data:
  z2_redis_data:
  z2_nats_data:
